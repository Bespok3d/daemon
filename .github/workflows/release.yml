name: build-and-release
on:
  push:
    tags: ['daemon-v*']
  workflow_dispatch:
    inputs:
      prospective-tag: { type: string, required: true }
      selected-ids: { type: string, required: true }
      expected-source-sha: { type: string, required: true }
      release-kind: { type: choice, options: [draft, prerelease, live], default: draft }
      publish: { type: boolean, default: false }
      prepared-receipt: { type: string, default: '' }

concurrency:
  group: unit-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Fetch shared-tooling submodule
        run: |
          git config --global url."https://x-access-token:${{ secrets.MAIN_INDEX_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check selected daemon tag
        env:
          RELEASE_TAG: ${{ inputs.prospective-tag || github.ref_name }}
        run: python3 scripts/tag_version_guard.py "$RELEASE_TAG"
      - name: Daemon gate
        run: bash scripts/check.sh
      - id: release
        uses: Bespok3d/b3-builder@5ac544b30634961cbad39659ebbb99172de68c64
        with:
          managed-release: 'true'
          manifest-path: manifest.json
          tag-prefix: daemon
          stage-command: sh scripts/stage-package.sh
          release-tag: ${{ inputs.prospective-tag }}
          selected-ids: ${{ inputs.selected-ids }}
          expected-source-sha: ${{ inputs.expected-source-sha }}
          release-kind: ${{ inputs.release-kind }}
          publish: ${{ github.event_name == 'push' || inputs.publish }}
          prepared-receipt: ${{ inputs.prepared-receipt }}
          require-signature: 'true'
          register-commit: df4eec856264bebffaa37d93ab1c51363fd6ef92
          unit: repo
          signing-key: ${{ secrets.REGISTRY_SIGNING_KEY }}
          bake: 'true'
          atom-repo: ${{ github.repository }}
      - uses: Bespok3d/main-index/.github/actions/register-atoms@df4eec856264bebffaa37d93ab1c51363fd6ef92
        if: ${{ steps.release.outputs.publish == 'true' }}
        with:
          atoms-dir: dist/registration
          selected-ids: ${{ steps.release.outputs.selected-ids }}
          release-kind: ${{ steps.release.outputs.release-kind }}
          token: ${{ secrets.MAIN_INDEX_TOKEN }}
